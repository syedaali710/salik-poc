# Local two-service stack: FastAPI API + Next.js frontend
# Usage (from salik-poc): docker compose up --build

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost:3000

  frontend:
    build: ../salic-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
